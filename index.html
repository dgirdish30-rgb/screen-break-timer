<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dceee5">
    <title>Screen Break Timer V5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ground-glow" aria-hidden="true"></div>

    <div class="buddy-wrap" aria-label="Support buddy">
        <div class="buddy" id="buddy">
            <div class="buddy-head" aria-hidden="true">
                <div class="buddy-eye left"></div>
                <div class="buddy-eye right"></div>
                <div class="buddy-mouth"></div>
            </div>
            <div class="buddy-bubble" id="buddyBubble">
                <p id="buddyText">I’m here when you want to pause.</p>
            </div>
            <button id="buddyButton" class="buddy-button" type="button">Breathe</button>
        </div>
    </div>

    <main class="container">
        <p class="eyebrow">A quiet moment for your attention</p>

        <section class="timer-display" id="timerDisplay" aria-live="polite">
            <div class="time" id="timeText">25:00</div>
            <div class="state" id="stateText">Ready</div>
        </section>

        <div class="controls" aria-label="Timer controls">
            <label class="voice-control">
                <input type="checkbox" id="voiceToggle" checked>
                <span>Voice updates</span>
            </label>
            <button class="start-button" id="startBtn">Start</button>
            <button class="secondary-button" id="pauseBtn">Pause</button>
            <button class="secondary-button" id="resetBtn">Reset</button>
        </div>

        <div class="instructions" id="instructions">
            <p>Set a timer, then let the screen become quiet.</p>
            <p id="voiceStatus">Voice updates are on.</p>
        </div>
    </main>

    <script src="timer.js"></script>
</body>
</html>

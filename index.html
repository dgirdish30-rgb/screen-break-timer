<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Break Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="timer-display" id="timerDisplay">
            <div class="time" id="timeText">25:00</div>
            <div class="state" id="stateText">Ready</div>
        </div>
        
        <button class="start-button" id="startBtn">Start</button>
        
        <div class="instructions" id="instructions">
            <p>Set a timer. Step away from the screen.</p>
            <p>Honor what you commit to.</p>
        </div>
    </div>

    <script src="timer.js"></script>
</body>
</html>
